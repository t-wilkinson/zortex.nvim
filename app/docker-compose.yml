# app/docker-compose.yml
services:
  zortex:
    # the released image; or build it here: replace with `build: ./`
    image: ghcr.io/t-wilkinson/zortex:${ZORTEX_VERSION:-latest}
    container_name: zortex
    restart: unless-stopped
    environment:
      # ntfy delivers calendar notifications and pomodoro alerts. Anyone who
      # knows a topic on a public server can read it: pick a private one.
      - NTFY_SERVER_URL=${NTFY_SERVER_URL:-https://ntfy.sh}
      - NTFY_TOPIC=${NTFY_TOPIC:?set a private topic}
      - NTFY_AUTH_TOKEN=${NTFY_AUTH_TOKEN:-}
      # optional: required by /notify and /pending (set the same in the plugin's server.api_key)
      - ZORTEX_API_KEY=${ZORTEX_API_KEY:-}
      - ZORTEX_TITLE=${ZORTEX_TITLE:-Zortex}
      # the calendar's time zone, e.g. America/New_York (unset: UTC)
      - TZ=${TZ:-}
      # edit notes from the browser (then drop :ro below)
      - ZORTEX_WRITABLE=${ZORTEX_WRITABLE:-}
      # let HTML files run JavaScript (sandboxed)
      - ZORTEX_HTML_SCRIPTS=${ZORTEX_HTML_SCRIPTS:-}
    volumes:
      # Synced notes (read-only unless ZORTEX_WRITABLE=1)
      - ${NOTES_PATH:-./notes}:/notes:ro
      # The server's state: notifications, pomodoro, clocks, time tracking
      - zortex_data:/data
    ports:
      # Localhost only: put a reverse proxy with authentication in front
      - "127.0.0.1:8090:8090"

volumes:
  zortex_data:
