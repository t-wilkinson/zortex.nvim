# app/docker-compose.yml
services:
  zortex:
    build: ./
    container_name: zortex
    restart: unless-stopped
    environment:
      # ntfy delivers calendar notifications and pomodoro alerts
      - NTFY_SERVER_URL=${NTFY_SERVER_URL:-https://ntfy.sh}
      - NTFY_TOPIC=${NTFY_TOPIC:-zortex-notify}
      - NTFY_AUTH_TOKEN=${NTFY_AUTH_TOKEN:-}
      # optional: required by /notify and /pending (set the same in the plugin's server.api_key)
      - ZORTEX_API_KEY=${ZORTEX_API_KEY:-}
      - ZORTEX_TITLE=${ZORTEX_TITLE:-Zortex}
      - TZ=${TZ:-America/New_York}
    volumes:
      # Synced notes (read-only)
      - ${NOTES_PATH:-./notes}:/notes:ro
      # Notifications and the pomodoro clock
      - zortex_data:/data
    ports:
      # Localhost only: put a reverse proxy with authentication in front
      - "127.0.0.1:8090:8090"

volumes:
  zortex_data:
