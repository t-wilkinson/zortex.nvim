# Lua tests on Neovim stable and nightly, the Go module, and generated files
# that must be up to date (README command table, parser fixtures).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lua:
    name: Neovim ${{ matrix.neovim }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        neovim: [stable, nightly, v0.10.4]
    steps:
      - uses: actions/checkout@v5
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim }}
      - name: Tests
        run: nvim --headless -u NONE -l tests/run.lua
      - name: Generated files are up to date
        if: matrix.neovim == 'stable'
        run: |
          nvim --headless -u NONE -l tests/gen_docs.lua
          nvim --headless -u NONE -l tests/gen_ast.lua
          nvim --headless -u NONE -l tests/gen_links.lua
          nvim --headless -u NONE -l tests/gen_edits.lua
          git diff --exit-code || { echo "::error::run the tests/gen_*.lua scripts and commit the result"; exit 1; }

  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: app/go.mod
      - name: gofmt
        run: test -z "$(gofmt -l app)" || { gofmt -l app; exit 1; }
      - name: vet
        run: go -C app vet ./...
      - name: test
        run: go -C app test -race ./...

  nix:
    name: Nix build (runs the Go tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v30
      - run: nix build -L .#default
      - run: nix flake check --no-build
