<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{if and .Title (ne .Title .Site)}}{{.Title}} · {{end}}{{.Site}}</title>
<link rel="stylesheet" href="{{asset "/static/style.css"}}">
<link rel="icon" href="{{asset "/static/icon.svg"}}" type="image/svg+xml">
<link rel="manifest" href="{{u "/manifest.webmanifest"}}" crossorigin="use-credentials">
<link rel="apple-touch-icon" href="{{asset "/static/icons/apple-touch-icon.png"}}">
<meta name="theme-color" content="#f7f5f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15171a" media="(prefers-color-scheme: dark)">
<script src="{{asset "/static/app.js"}}" defer></script>
<script src="{{asset "/static/hover.js"}}" defer></script>
<script src="{{asset "/static/live.js"}}" defer></script>
<script src="{{asset "/static/tables.js"}}" defer></script>
<script src="{{asset "/static/inbox.js"}}" defer></script>
<script src="{{asset "/static/math.js"}}" data-katex="{{asset "/static/katex/katex.min.js"}}" data-katex-css="{{asset "/static/katex/katex.min.css"}}" defer></script>
</head>
<body data-base="{{.Base}}" data-sw="{{asset "/sw.js"}}">
<header class="top">
  <a class="brand" href="{{u "/"}}">{{.Site}}</a>
  <form class="quick" action="{{u "/search"}}" method="get" role="search">
    <input type="search" name="q" value="{{.Query}}" placeholder="Search notes  ( / )" aria-label="Search notes" autocomplete="off" id="quick">
  </form>
  <nav class="links">
    <a href="{{u "/projects"}}"{{if eq .Nav "projects"}} aria-current="page"{{end}}>Projects</a>
    <a href="{{u "/okr"}}"{{if eq .Nav "okr"}} aria-current="page"{{end}}>Objectives</a>
    <a href="{{fileURL ""}}"{{if eq .Nav "files"}} aria-current="page"{{end}}>Files</a>
    <a href="{{u "/broken"}}"{{if eq .Nav "broken"}} aria-current="page"{{end}}>Broken</a>
    <a href="{{u "/graph"}}"{{if eq .Nav "graph"}} aria-current="page"{{end}}>Graph</a>
  </nav>
</header>
<main>
{{block "content" .}}{{end}}
</main>
</body>
</html>
